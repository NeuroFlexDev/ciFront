name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/neuroflexdev/cifront

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

  image:
    name: Build and publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/neuroflexdev/cifront:sha-${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=cifront
          cache-to: type=gha,mode=max,scope=cifront
          build-args: VITE_API_BASE_URL=/api

  image-security:
    name: Scan image and publish SBOM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/neuroflexdev/cifront@${{ needs.image.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable image
        run: docker pull "${IMAGE}"

      - name: Smoke-test the runtime container
        run: |
          docker run --detach --name cifront-smoke --publish 18080:80 "${IMAGE}"
          trap 'docker rm --force cifront-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18080/ >/dev/null && exit 0
            sleep 2
          done
          docker logs cifront-smoke
          exit 1

      - name: Write vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e # v3.29.0
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/out" \
            anchore/syft@sha256:c15fa8af4c25edd72c0daf026d095fe51adbcfc7ad5d79a66e93d88f249e5abb \
            "${IMAGE}" \
            -o "spdx-json=/out/cifront-${GITHUB_SHA}.spdx.json"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cifront-${{ github.sha }}-sbom
          path: ${{ runner.temp }}/cifront-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [image, image-security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://dev.platform.lernium.ru/auth
    concurrency:
      group: lernium-staging-frontend
      cancel-in-progress: false
    steps:
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
          BASTION_HOST: ${{ vars.STAGING_BASTION_HOST }}
          BASTION_USER: ${{ vars.STAGING_BASTION_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${BASTION_HOST}"
          test -n "${BASTION_USER}"
          test -n "${DEPLOY_KEY}"
          test -n "${KNOWN_HOSTS}"
          [[ "${ACTOR}" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[0-9.]+$ ]]
          [[ "${BASTION_HOST}" =~ ^[0-9.]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${BASTION_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

          printf '%s\n' "${GHCR_TOKEN}" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o "ProxyCommand=ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ${HOME}/.ssh/id_ed25519 -W %h:%p ${BASTION_USER}@${BASTION_HOST}" \
            -i "${HOME}/.ssh/id_ed25519" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/lernium-deploy frontend ${IMAGE} ${ACTOR}"
